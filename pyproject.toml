[project]
name = "ai-task-manager"
version = "0.1.0"
description = "Supervised task coordination for coding agent CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Manaferra Inc." }]
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
