[project]
name = "ai-task-manager"
version = "0.1.0"
description = "Supervised task coordination for coding agent CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Manaferra Inc." }]
dependencies = [
    "claude-agent-sdk==0.2.176",
    "mcp==2.3.0",
    "PyYAML==6.0.3",
]

[project.scripts]
aitm = "ai_task_manager.presentation.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_task_manager"]

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
