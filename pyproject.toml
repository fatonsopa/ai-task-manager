[project]
name = "ai-task-manager"
version = "0.1.0"
description = "Supervised task coordination for coding agent CLIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Manaferra Inc." }]
dependencies = [
    "claude-agent-sdk==0.2.176",
    "markdown-it-py==4.2.0",
    "mcp==2.3.0",
    "PyYAML==6.0.3",
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.scripts]
aitm = "ai_task_manager.presentation.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_task_manager"]

[dependency-groups]
dev = [
    "coverage==7.14.2",
    "mypy==2.4.1",
    "hypothesis>=6.100,<7",
    "pyte==0.8.2",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/ai_task_manager"]
cache_dir = ".local/mypy-cache"
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
data_file = ".local/coverage/.coverage"
source = ["ai_task_manager"]

[tool.coverage.report]
show_missing = true
